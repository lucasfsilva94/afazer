# Hooks do projeto para os comandos do Companion.
# Integração GitHub Issues + Projects: config em .specify/github-project.yml,
# script em .specify/scripts/bash/gh-project-sync.sh (nunca falha o comando).
commands:
  tasks:
    hooks:
      after:
        tasks-doc:
          - type: prompt
            text: "Crie as issues que faltam e coloque todas no GitHub Project: rode `bash .specify/scripts/bash/gh-project-sync.sh ensure <feature_directory>/tasks.md`. Uma issue por tarefa, título `T###: descrição`. Se o gh não tiver o escopo project, avise e siga."
  implement:
    hooks:
      before:
        implement-exec:
          - type: prompt
            text: "Antes de começar cada tarefa T###, mova a issue para In progress: `bash .specify/scripts/bash/gh-project-sync.sh move T### in-progress`. Para uma onda paralela, mova todas as tarefas da onda antes de iniciá-la. Logo depois de cada `--close-task T###`, mova para Done: `bash .specify/scripts/bash/gh-project-sync.sh move T### done` (também fecha a issue). No fim do passo, rode `bash .specify/scripts/bash/gh-project-sync.sh sync` como rede de segurança. Falha do GitHub vira aviso, nunca interrompe o implement."
